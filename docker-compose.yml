services:
  backend-fastapi:
    build: ./backend/fastapi
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pawnalysis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pawnalysis}
      - POSTGRES_DB=${POSTGRES_DB:-pawnalysis}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend-dotnet:
    build:
      context: ./pawnalysis-backend
      dockerfile: API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-pawnalysis};Username=${POSTGRES_USER:-pawnalysis};Password=${POSTGRES_PASSWORD:-pawnalysis}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-pawnalysis-api}
      - Jwt__Audience=${JWT_AUDIENCE:-pawnalysis-client}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend-fastapi

volumes:
  postgres-data:
